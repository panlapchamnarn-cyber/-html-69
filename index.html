<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบติดตามประเมินผล KPI โรงพยาบาลสวนสราญรมย์</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--g:#064e3b;--g2:#047857;--lime:#84cc16;--bg:#f0fdf4;--ink:#17352c;--muted:#64748b;--red:#dc2626;--amber:#d97706;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#ecfdf5,#f8fafc 45%,#ecfccb);font-family:"Noto Sans Thai",Tahoma,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,#052e2b,#065f46 65%,#65a30d);color:#fff;padding:24px 4vw;box-shadow:0 8px 30px #064e3b40}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand h1{font-size:clamp(20px,3vw,34px);margin:0}.brand p{margin:5px 0 0;color:#d1fae5}.wrap{width:min(1500px,94vw);margin:22px auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:#fff;color:var(--g)}.btn.primary{background:var(--g2);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:18px 0}.card{background:#ffffffd9;border:1px solid #d1fae5;border-radius:16px;padding:17px;box-shadow:0 5px 16px #064e3b12}.card b{display:block;font-size:28px;margin-top:7px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;background:white;padding:14px;border-radius:14px;margin-bottom:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}.tablebox{background:white;border-radius:15px;overflow:auto;box-shadow:0 5px 18px #064e3b12;max-height:61vh}table{border-collapse:collapse;width:100%;min-width:1150px}th{position:sticky;top:0;z-index:2;background:var(--g);color:white;padding:12px 9px;text-align:left}td{padding:10px 9px;border-bottom:1px solid #e2e8f0;vertical-align:top}tbody tr:hover{background:#f0fdf4}.pill{white-space:nowrap;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.progress{background:#fef3c7;color:#92400e}.none{background:#e2e8f0;color:#475569}.link{color:#047857;font-weight:800;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#022c22bb;z-index:10;padding:3vh;overflow:auto}.modal.open{display:flex}.panel{margin:auto;background:white;border-radius:18px;padding:22px;width:min(900px,96vw);max-height:94vh;overflow:auto;box-shadow:0 20px 70px #0007}.panel.wide{width:min(1200px,96vw)}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:start}.x{border:0;background:#e2e8f0;border-radius:50%;width:35px;height:35px;font-size:20px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.span2{grid-column:span 2}.monthly{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.month{border:1px solid #d1fae5;border-radius:10px;padding:10px}.chartbox{height:300px;margin:14px 0}.toast{position:fixed;right:20px;bottom:20px;padding:13px 18px;border-radius:10px;background:#052e2b;color:white;z-index:30;display:none}.muted{color:var(--muted);font-size:13px}.adminonly{display:none}body.admin .adminonly{display:inline-block}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.monthly{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards,.grid,.filters,.monthly{grid-template-columns:1fr}.span2{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="top"><div class="brand"><h1>ระบบติดตามประเมินผล KPI</h1><p>โรงพยาบาลสวนสราญรมย์ · ปีงบประมาณ 2569</p></div><div class="actions"><button class="btn adminonly" onclick="openEdit()">＋ เพิ่ม KPI</button><label class="btn adminonly" style="margin:0">⇧ นำเข้า Excel<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label><button id="loginBtn" class="btn" onclick="openModal('loginModal')">เข้าสู่ระบบผู้ดูแล</button></div></div></header>
<main class="wrap"><div class="cards"><div class="card">KPI ทั้งหมด<b id="cAll">-</b></div><div class="card">ผ่านเป้าหมาย<b id="cPass" style="color:#16a34a">-</b></div><div class="card">ไม่ผ่านเป้าหมาย<b id="cFail" style="color:#dc2626">-</b></div><div class="card">กำลังดำเนินการ<b id="cProg" style="color:#d97706">-</b></div><div class="card">ร้อยละที่ผ่าน<b id="cRate">-</b></div></div>
<section class="filters"><input id="q" placeholder="ค้นหาตัวชี้วัด..."><select id="fGroup"><option value="">ทุกหมวด</option></select><select id="fOwner"><option value="">ทุกผู้รับผิดชอบ</option></select><select id="fStatus"><option value="">ทุกสถานะ</option><option>ผ่าน</option><option>ไม่ผ่าน</option><option>อยู่ระหว่างดำเนินการ</option><option>ยังไม่มีข้อมูล</option></select><button class="btn primary" onclick="loadData()">↻ รีเฟรช</button></section>
<div class="tablebox"><table><thead><tr><th>หมวด</th><th>ลำดับ</th><th>ตัวชี้วัด</th><th>เป้าหมาย</th><th>หน่วย</th><th>ผลลัพธ์ล่าสุด</th><th>ผู้รับผิดชอบ รพ.</th><th>สถานะ</th><th class="adminonly">จัดการ</th></tr></thead><tbody id="tbody"></tbody></table></div><p class="muted" id="stamp"></p></main>

<div class="modal" id="loginModal"><div class="panel" style="max-width:430px"><div class="panelhead"><h2>เข้าสู่ระบบผู้ดูแล</h2><button class="x" onclick="closeModal('loginModal')">×</button></div><form id="loginForm"><label>ชื่อผู้ใช้</label><input id="username" autocomplete="username" placeholder="กรอกชื่อผู้ใช้"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน"><button class="btn primary" style="width:100%;margin-top:16px">เข้าสู่ระบบ</button></form></div></div>
<div class="modal" id="detailModal"><div class="panel wide"><div class="panelhead"><div><h2 id="detailTitle"></h2><div id="detailMeta" class="muted"></div></div><button class="x" onclick="closeModal('detailModal')">×</button></div><div class="chartbox"><canvas id="chart"></canvas></div><h3>ผลงานรายเดือน (บันทึกวันที่ 1 ของเดือน)</h3><div id="months" class="monthly"></div></div></div>
<div class="modal" id="editModal"><div class="panel"><div class="panelhead"><h2 id="editTitle">ข้อมูล KPI</h2><button class="x" onclick="closeModal('editModal')">×</button></div><form id="editForm"><input id="eID" type="hidden"><div class="grid"><div><label>หมวด</label><input id="eGroup"></div><div><label>ลำดับ</label><input id="eNo"></div><div class="span2"><label>ตัวชี้วัด *</label><textarea id="eKpi" rows="3"></textarea></div><div><label>เป้าหมาย</label><input id="eTarget"></div><div><label>หน่วยการวัด</label><input id="eUnit"></div><div><label>ผลลัพธ์</label><input id="eResult"></div><div><label>ผู้รับผิดชอบ รพ.</label><input id="eOwner"></div><div class="span2"><label>แหล่งข้อมูล</label><input id="eSource"></div><div><label>ทิศทางเป้าหมาย</label><select id="eDirection"><option>สูงกว่าดีกว่า</option><option>ต่ำกว่าดีกว่า</option><option>เท่ากับ</option></select></div></div><button class="btn primary" style="margin-top:16px">บันทึก</button></form></div></div><div id="toast" class="toast"></div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxPAKFYuiPB6yYzktbbNl3NChAa8T0v1FOk7AbM6xLJ4DExDHShEllUEuN7Ls1VASfLfw/exec';
const MONTHS=[['2025-10','ต.ค. 2568'],['2025-11','พ.ย. 2568'],['2025-12','ธ.ค. 2568'],['2026-01','ม.ค. 2569'],['2026-02','ก.พ. 2569'],['2026-03','มี.ค. 2569'],['2026-04','เม.ย. 2569'],['2026-05','พ.ค. 2569'],['2026-06','มิ.ย. 2569'],['2026-07','ก.ค. 2569'],['2026-08','ส.ค. 2569'],['2026-09','ก.ย. 2569']];
let state={kpis:[],monthlyResults:[],token:'',user:null,current:null,chart:null};
function configured(){return !WEB_APP_URL.includes('{{')&&/^https:\/\//.test(WEB_APP_URL)}
function api(action,payload={}){return new Promise((resolve,reject)=>{if(!configured())return reject(new Error('กรุณาแทนที่ {{ลิงก์_Web_App_GAS}} ในไฟล์ index.html'));const cb='gas_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>done(new Error('เชื่อมต่อเซิร์ฟเวอร์หมดเวลา')),30000);function done(err,data){clearTimeout(timer);delete window[cb];s.remove();err?reject(err):data&&data.ok===false?reject(new Error(data.message)):resolve(data)}window[cb]=d=>done(null,d);s.onerror=()=>done(new Error('เชื่อมต่อ Web App ไม่สำเร็จ'));s.src=WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'action='+encodeURIComponent(action)+'&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload));document.body.appendChild(s)})}
async function loadData(){try{const d=await api('getData');state.kpis=d.kpis||[];state.monthlyResults=d.monthlyResults||[];renderFilters();render();stamp.textContent='ข้อมูลจาก Google Sheet ล่าสุด: '+(d.fetchedAt||'')}catch(e){toast(e.message,true);tbody.innerHTML='<tr><td colspan="9" class="empty">'+esc(e.message)+'</td></tr>'}}
function latest(k){return state.monthlyResults.filter(x=>String(x.KPI_ID)===String(k.ID)).sort((a,b)=>String(a['วันที่']).localeCompare(String(b['วันที่']))).at(-1)}
function num(v){const m=String(v??'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:null}
function targetNum(k){return num(k['เป้าหมาย'])}
function status(k){const rs=state.monthlyResults.filter(x=>String(x.KPI_ID)===String(k.ID));let raw;if(rs.length)raw=rs.sort((a,b)=>String(a['วันที่']).localeCompare(String(b['วันที่']))).at(-1)['ผลงาน'];else raw=k['ผลลัพธ์'];if(raw===''||raw===null||raw===undefined)return 'ยังไม่มีข้อมูล';if(/รอประเมิน|NA|N\/A|ไม่พบอุบัติการณ์/i.test(String(raw)))return 'อยู่ระหว่างดำเนินการ';const v=num(raw),t=targetNum(k);if(v===null||t===null)return 'อยู่ระหว่างดำเนินการ';const d=k['ทิศทาง']||inferDirection(k['เป้าหมาย']);return d==='ต่ำกว่าดีกว่า'?(v<=t?'ผ่าน':'ไม่ผ่าน'):d==='เท่ากับ'?(v===t?'ผ่าน':'ไม่ผ่าน'):(v>=t?'ผ่าน':'ไม่ผ่าน')}
function inferDirection(t){t=String(t||'');return /≤|<|ไม่เกิน|น้อยกว่า/.test(t)?'ต่ำกว่าดีกว่า':/^\s*0\b/.test(t)?'เท่ากับ':'สูงกว่าดีกว่า'}
function cls(s){return s==='ผ่าน'?'pass':s==='ไม่ผ่าน'?'fail':s==='อยู่ระหว่างดำเนินการ'?'progress':'none'}
function filtered(){const text=q.value.toLowerCase(),g=fGroup.value,o=fOwner.value,s=fStatus.value;return state.kpis.filter(k=>(!text||JSON.stringify(k).toLowerCase().includes(text))&&(!g||k['หมวด']===g)&&(!o||k['ผู้รับผิดชอบ รพ.']===o)&&(!s||status(k)===s))}
function render(){const rows=filtered();tbody.innerHTML=rows.length?rows.map(k=>{const l=latest(k),s=status(k);return `<tr><td>${esc(k['หมวด'])}</td><td>${esc(k['ลำดับ'])}</td><td><span class="link" onclick="openDetail('${k.ID}')">${esc(k['ตัวชี้วัด'])}</span></td><td>${esc(k['เป้าหมาย'])}</td><td>${esc(k['หน่วยการวัด'])}</td><td>${esc(l?l['ผลงาน']:k['ผลลัพธ์']||'-')}</td><td>${esc(k['ผู้รับผิดชอบ รพ.']||'-')}</td><td><span class="pill ${cls(s)}">${s}</span></td><td class="adminonly"><button class="btn" onclick="openEdit('${k.ID}')">แก้ไข</button> <button class="btn danger" onclick="removeKpi('${k.ID}')">ลบ</button></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">ไม่พบข้อมูล</td></tr>';const sts=state.kpis.map(status),p=sts.filter(x=>x==='ผ่าน').length;cAll.textContent=state.kpis.length;cPass.textContent=p;cFail.textContent=sts.filter(x=>x==='ไม่ผ่าน').length;cProg.textContent=sts.filter(x=>x==='อยู่ระหว่างดำเนินการ').length;cRate.textContent=(state.kpis.length?(p/state.kpis.length*100).toFixed(1):0)+'%' }
function renderFilters(){const keep=[fGroup.value,fOwner.value];const opts=(key)=>[...new Set(state.kpis.map(x=>x[key]).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('');fGroup.innerHTML='<option value="">ทุกหมวด</option>'+opts('หมวด');fOwner.innerHTML='<option value="">ทุกผู้รับผิดชอบ</option>'+opts('ผู้รับผิดชอบ รพ.');fGroup.value=keep[0];fOwner.value=keep[1]}
function openDetail(id){const k=state.kpis.find(x=>String(x.ID)===String(id));state.current=k;detailTitle.textContent=k['ตัวชี้วัด'];detailMeta.textContent=`${k['หมวด']} · เป้าหมาย ${k['เป้าหมาย']} · สถานะ ${status(k)}`;const values=MONTHS.map(m=>state.monthlyResults.find(x=>String(x.KPI_ID)===String(id)&&String(x['วันที่']).startsWith(m[0])));months.innerHTML=MONTHS.map((m,i)=>`<div class="month"><b>${m[1]}</b><input id="mv${i}" value="${esc(values[i]?.['ผลงาน']??'')}" placeholder="ผลงาน" ${state.token?'':'disabled'}><input id="mn${i}" value="${esc(values[i]?.['หมายเหตุ']??'')}" placeholder="หมายเหตุ" ${state.token?'':'disabled'} style="margin-top:6px">${state.token?`<button class="btn primary" onclick="saveMonth(${i})" style="margin-top:6px;width:100%">บันทึก</button>`:''}</div>`).join('');if(state.chart)state.chart.destroy();state.chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:MONTHS.map(x=>x[1]),datasets:[{label:'ผลงาน',data:values.map(x=>num(x?.['ผลงาน'])),borderColor:'#047857',backgroundColor:'#10b98133',fill:true,tension:.3},{label:'เป้าหมาย',data:MONTHS.map(()=>targetNum(k)),borderColor:'#d97706',borderDash:[6,5],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false}});openModal('detailModal')}
async function saveMonth(i){try{await api('saveMonthlyResult',{token:state.token,kpiId:state.current.ID,date:MONTHS[i][0]+'-01',value:document.getElementById('mv'+i).value,note:document.getElementById('mn'+i).value});toast('บันทึกแล้ว');await loadData();openDetail(state.current.ID)}catch(e){toast(e.message,true)}}
function openEdit(id=''){const k=state.kpis.find(x=>String(x.ID)===String(id))||{};eID.value=k.ID||'';eGroup.value=k['หมวด']||'';eNo.value=k['ลำดับ']||'';eKpi.value=k['ตัวชี้วัด']||'';eTarget.value=k['เป้าหมาย']||'';eUnit.value=k['หน่วยการวัด']||'';eResult.value=k['ผลลัพธ์']||'';eOwner.value=k['ผู้รับผิดชอบ รพ.']||'';eSource.value=k['แหล่งข้อมูล']||'';eDirection.value=k['ทิศทาง']||inferDirection(k['เป้าหมาย']);openModal('editModal')}
editForm.onsubmit=async e=>{e.preventDefault();const item={ID:eID.value,'หมวด':eGroup.value,'ลำดับ':eNo.value,'ตัวชี้วัด':eKpi.value,'เป้าหมาย':eTarget.value,'หน่วยการวัด':eUnit.value,'ผลลัพธ์':eResult.value,'ผู้รับผิดชอบ รพ.':eOwner.value,'แหล่งข้อมูล':eSource.value,'ทิศทาง':eDirection.value};try{await api(item.ID?'updateData':'addData',{token:state.token,item});closeModal('editModal');toast('บันทึกข้อมูลแล้ว');loadData()}catch(err){toast(err.message,true)}};
async function removeKpi(id){if(!confirm('ยืนยันลบ KPI และผลงานรายเดือนทั้งหมด?'))return;try{await api('deleteData',{token:state.token,id});toast('ลบแล้ว');loadData()}catch(e){toast(e.message,true)}}
loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('login',{username:username.value,password:password.value});state.token=d.token;state.user=d.user;document.body.classList.add('admin');loginBtn.textContent='ออกจากระบบ ('+d.user.username+')';loginBtn.onclick=logout;password.value='';closeModal('loginModal');toast('เข้าสู่ระบบสำเร็จ');render()}catch(err){toast(err.message,true)}};
function logout(){state.token='';state.user=null;document.body.classList.remove('admin');loginBtn.textContent='เข้าสู่ระบบผู้ดูแล';loginBtn.onclick=()=>openModal('loginModal');render();toast('ออกจากระบบแล้ว')}
file.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],items=XLSX.utils.sheet_to_json(ws,{defval:''});const normalized=items.map(x=>({'หมวด':x['หมวด']||x['ยุทธศาสตร์']||'','ลำดับ':x['ลำดับ']||'','ตัวชี้วัด':x['ตัวชี้วัด']||'','เป้าหมาย':x['เป้าหมาย']||'','หน่วยการวัด':x['หน่วยการวัด']||x['หน่วย']||'','แหล่งข้อมูล':x['แหล่งข้อมูล']||'','ผลลัพธ์':x['ผลลัพธ์']||'','ผู้รับผิดชอบ รพ.':x['ผู้รับผิดชอบ รพ.']||x['ผู้รับผิดชอบ']||'','ทิศทาง':x['ทิศทาง']||''}));let added=0,skipped=0;for(let i=0;i<normalized.length;i+=20){const r=await api('importData',{token:state.token,items:normalized.slice(i,i+20)});added+=r.added;skipped+=r.skipped}toast(`นำเข้าใหม่ ${added} รายการ · ข้าม ${skipped} รายการ`);loadData()}catch(err){toast(err.message,true)}finally{e.target.value=''}};
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m,bad=false){const t=document.getElementById('toast');t.textContent=m;t.style.background=bad?'#991b1b':'#052e2b';t.style.display='block';setTimeout(()=>t.style.display='none',4000)}
[q,fGroup,fOwner,fStatus].forEach(x=>x.addEventListener(x===q?'input':'change',render));document.querySelectorAll('.modal').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('open')}));loadData();
</script></body></html>
